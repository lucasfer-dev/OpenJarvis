name: Lucas Jarvis V1 checks

on:
  pull_request:
    paths:
      - "src/openjarvis/tools/windows_control.py"
      - "src/openjarvis/tools/__init__.py"
      - "tests/test_windows_control.py"
      - "skills/tech-fast-track/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Compile new module
        run: python -m py_compile src/openjarvis/tools/windows_control.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_windows_control.py
